[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery>=5.4.0",
    "fastapi>=0.136.1",
    "httpx>=0.27.0",
    "pydantic>=2.13.3",
    "phonenumbers>=9.0.41",
    "pydantic[email]>=2.13.3",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn>=0.46.0",
    "python-jose[cryptography]>=3.5.0",
    "pyjwt>=2.15.1",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "models", "repositories", "schemas", "services", "validators"]

[tool.ruff.lint.per-file-ignores]
"src/services/*.py" = ["I001"]
