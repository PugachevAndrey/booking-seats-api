name: Deploy to Server

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail

            DEPLOY_DIR="${DEPLOY_PATH:-$HOME/project}"
            cd "$DEPLOY_DIR"

            test -d "$DEPLOY_DIR" || { echo "ERROR: deploy dir not found: $DEPLOY_DIR"; exit 1; }
            test -f infra/.env || { echo "ERROR: infra/.env missing on server"; exit 1; }

            git fetch origin develop
            git reset --hard origin/develop

            docker compose -f infra/docker-compose.yaml up -d --build --wait --remove-orphans

            docker image prune -af --filter "until=72h" || true
            docker builder prune -f || true
