# Конфигурация внутреннего Nginx.
# Лимит синхронизирован с MAX_FILE_SIZE из src/api/v1/constants.py (5 Мб).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Лимит размера тела запроса. При превышении Nginx возвращает 413.
        client_max_body_size 5m;

        error_page 413 = @too_large;

        location / {
            # Динамический резолвинг имени app: после пересоздания контейнера
            # приложения nginx пере-резолвит его новый IP (кэш 10 секунд) вместо
            # закешированного адреса старого контейнера (иначе возникает 502).
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $app_upstream http://app:8000;
            proxy_pass $app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ответ при превышении client_max_body_size.
        # Формат совпадает с error_payload() и ValidationError из приложения.
        location @too_large {
            default_type application/json;
            return 413 '{"code": "VALIDATION_ERROR", "message": "Файл больше 5 Мб."}';
        }
    }
}
